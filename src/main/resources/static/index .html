
<!DOCTYPE html>
<html>

<head>
    <title>User Management System</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f111a;
            color: #e2e8f0;
        }

        h2 {
            margin-top: 20px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .form-container {
            background-color: #1e2235;
            padding: 30px;
            border-radius: 12px;
            width: 360px;
            margin-bottom: 40px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 14px;
            margin-bottom: 20px;
            background-color: #11131e;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 14px;
            color: #ffffff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .delete-btn {
            background: #dc2626;
        }

        .update-btn {
            background: #2563eb;
        }

        table {
            width: 90%;
            max-width: 700px;
            border-collapse: collapse;
            background-color: #1e2235;
        }

        th, td {
            padding: 14px 18px;
            text-align: center;
            border: 1px solid #313852;
        }

        th {
            background-color: #262b44;
            color: #a78bfa;
        }

        td {
            color: #e2e8f0;
        }
    </style>
</head>

<body>

<h2>Add New User</h2>

<div class="form-container">

    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="e.g., John Doe">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="e.g., john@gmail.com">

    <button type="button" onclick="addUser()">Add User</button>

</div>


<h2>Update User</h2>

<div class="form-container">

    <label for="updateId">User ID</label>
    <input type="number" id="updateId" placeholder="Enter User ID">

    <label for="updateName">Full Name</label>
    <input type="text" id="updateName" placeholder="Enter new name">

    <label for="updateEmail">Email</label>
    <input type="email" id="updateEmail" placeholder="Enter new email">

    <button type="button" class="update-btn" onclick="updateUser()">
        Update User
    </button>

</div>


<h2>Delete User</h2>

<div class="form-container">

    <label for="deleteId">User ID</label>
    <input type="number" id="deleteId" placeholder="Enter User ID">

    <button type="button" class="delete-btn" onclick="deleteUser()">
        Delete User
    </button>

</div>


<h2>Registered Users List</h2>

<button type="button" onclick="loadUsers()" style="width: 300px;">
    Refresh Users
</button>

<br><br>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
    </tr>
    </thead>

    <tbody id="tableBody">
    </tbody>

</table>


<script>

    // ==============================
    // GET ALL USERS
    // ==============================

    function loadUsers() {

        fetch('/users')

            .then(response => response.json())

            .then(users => {

                const table = document.getElementById('tableBody');

                table.innerHTML = '';

                users.forEach(user => {

                    const tr = document.createElement('tr');

                    tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                `;

                    table.appendChild(tr);
                });
            });
    }


    // ==============================
    // POST - ADD USER
    // ==============================

    function addUser() {

        const userName = document.getElementById('name').value;
        const userEmail = document.getElementById('email').value;

        if (userName === "" || userEmail === "") {

            alert("Please fill all fields");
            return;
        }

        const user = {

            name: userName,
            email: userEmail

        };

        fetch('/users', {

            method: 'POST',

            headers: {

                'Content-Type': 'application/json'

            },

            body: JSON.stringify(user)

        })

            .then(response => response.text())

            .then(message => {

                alert(message);

                document.getElementById('name').value = "";
                document.getElementById('email').value = "";

                loadUsers();

            });
    }


    // ==============================
    // PUT - UPDATE USER
    // ==============================

    function updateUser() {

        const id = document.getElementById('updateId').value;
        const name = document.getElementById('updateName').value;
        const email = document.getElementById('updateEmail').value;

        if (id === "" || name === "" || email === "") {

            alert("Please fill all fields");
            return;
        }

        const user = {

            name: name,
            email: email

        };

        fetch('/users/' + id, {

            method: 'PUT',

            headers: {

                'Content-Type': 'application/json'

            },

            body: JSON.stringify(user)

        })

            .then(response => response.text())

            .then(message => {

                alert(message);

                document.getElementById('updateId').value = "";
                document.getElementById('updateName').value = "";
                document.getElementById('updateEmail').value = "";

                loadUsers();

            });
    }


    // ==============================
    // DELETE USER
    // ==============================

    function deleteUser() {

        const id = document.getElementById('deleteId').value;

        if (id === "") {

            alert("Please enter User ID");
            return;
        }

        fetch('/users/' + id, {

            method: 'DELETE'

        })

            .then(response => response.text())

            .then(message => {

                alert(message);

                document.getElementById('deleteId').value = "";

                loadUsers();

            });
    }


    // ==============================
    // LOAD USERS WHEN PAGE OPENS
    // ==============================

    loadUsers();

</script>

</body>

</html>
